version: 2

# Novo serviço — não altera ACIDADEON_INTELLIGENCE.
name: CIDADEON_DASHBOARD
database: YOUTUBE_EPTV
schema: DEV
query_warehouse: YOUTUBE_EPTV_WH

label: "Cidade ON | Inteligência de Audiência"
description: "GA4 Web e AMP + Google Search Console, com filtros editoriais."
artifact_repo: CIDADEON_DASHBOARD_REPO

auto_resume: true
auto_suspend_secs: 600
min_instances: 1
max_instances: 1

ignore:
  - node_modules
  - .next
  - .env*
  - .git
  - .venv
  - .DS_Store
  - "*.zip"
  - "*.log"
  - "*.local"
  - secrets

install:
  commands:
    - [npm, install, --no-audit, --no-fund]

build:
  commands:
    - [npm, run, build]
    - [mkdir, -p, .next/standalone/.next]
    - [cp, -r, .next/static, .next/standalone/.next/static]

run:
  command: [node, .next/standalone/server.js]

environment_variables:
  - name: SNOWFLAKE_GA4_ACCESS_TOKEN_FILE
    value: /secrets/CIDADEON_GA4_OAUTH/access_token
  - name: SNOWFLAKE_GSC_ACCESS_TOKEN_FILE
    value: /secrets/CIDADEON_GSC_OAUTH/access_token

secrets:
  - name: CIDADEON_GA4_OAUTH
    secret: YOUTUBE_EPTV.DEV.CIDADEON_GA4_OAUTH
  - name: CIDADEON_GSC_OAUTH
    secret: YOUTUBE_EPTV.DEV.CIDADEON_GSC_OAUTH

external_access_integrations:
  - CIDADEON_GOOGLE_EAI
